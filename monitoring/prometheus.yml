global:
  scrape_interval: 15s

rule_files:
  - '/etc/prometheus/alerts.yml'

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['10.0.40.10:9093']
    
scrape_configs:
  - job_name: 'node'
    static_configs:
      - targets:
        - '10.0.20.10:9100'   # master
        - '10.0.20.11:9100'   # node1
        - '10.0.40.1:9100'
        - '10.0.20.12:9100'
        - '10.0.30.10:9100'

  - job_name: 'postgres'
    static_configs:
      - targets: ['10.0.30.10:9187']
